<!doctype html>
<html>
<head>
  <script type="text/javascript" src="/homey.js" data-origin="settings"></script>
  <style>
    body { padding: 0 4px 24px; }
    .url { display: block; resize: none; width: 100%; box-sizing: border-box; border: 0; outline: none; -webkit-user-select: text; user-select: text; padding: 12px; border-radius: 8px; background: #1e2430; color: #e8eaed;
      font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; word-break: break-all; margin: 8px 0; }
    .row { display: flex; gap: 8px; margin-bottom: 16px; }
    .row button { flex: 1; }
    ol { padding-left: 18px; } li { margin: 6px 0; line-height: 1.4; }
    .warn { padding: 10px 12px; border-radius: 8px; background: #fff4d6; color: #5c4400; line-height: 1.4; }
    .last { font-size: 13px; opacity: .85; line-height: 1.5; }
  </style>
</head>
<body>
  <h1 class="homey-title" data-t="settings.title"></h1>
  <p class="homey-subtitle" data-t="settings.intro"></p>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-t="settings.url_title"></legend>
    <textarea class="url" id="url" rows="3" readonly></textarea>
    <div class="row">
      <button class="homey-button-primary" id="copy" data-t="settings.copy"></button>
      <button class="homey-button-secondary" id="regen" data-t="settings.regenerate"></button>
    </div>
    <p class="last" id="last"></p>
  </fieldset>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-t="settings.builder_title"></legend>
    <p data-t="settings.builder_text"></p>
    <div class="homey-form-group">
      <label class="homey-form-label" for="person" data-t="settings.person"></label>
      <input class="homey-form-input" id="person" type="text" placeholder="Sebastian" />
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="method" data-t="settings.method"></label>
      <select class="homey-form-select" id="method">
        <option value="" data-t="settings.method_auto"></option>
        <option value="face" data-t="device.method.face"></option>
        <option value="fingerprint" data-t="device.method.fingerprint"></option>
        <option value="nfc" data-t="device.method.nfc"></option>
        <option value="pin" data-t="device.method.pin"></option>
      </select>
    </div>
    <textarea class="url" id="customUrl" rows="3" readonly></textarea>
    <div class="row"><button class="homey-button-primary" id="copyCustom" data-t="settings.copy"></button></div>
  </fieldset>

  <fieldset class="homey-form-fieldset">
    <legend class="homey-form-legend" data-t="settings.setup_title"></legend>
    <ol>
      <li data-t="settings.step1"></li>
      <li data-t="settings.step2"></li>
      <li data-t="settings.step3"></li>
      <li data-t="settings.step4"></li>
    </ol>
    <p class="warn" data-t="settings.warning"></p>
  </fieldset>

<script>
  // Homey's in-app browser blocks the async clipboard API and text selection in
  // ordinary elements. A selected read-only textarea + execCommand('copy') works
  // there; if even that fails the text stays selected for a manual copy.
  function copyField(el, onDone) {
    el.focus();
    el.select();
    try { el.setSelectionRange(0, el.value.length); } catch (e) { /* not supported */ }
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (ok) return onDone(true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el.value).then(function () { onDone(true); }, function () { onDone(false); });
    } else {
      onDone(false);
    }
  }

  function onHomeyReady(Homey) {
    document.querySelectorAll('[data-t]').forEach(function (el) {
      el.textContent = Homey.__(el.getAttribute('data-t'));
    });

    var baseUrl = '';
    function buildCustom() {
      var person = document.getElementById('person').value.trim();
      var method = document.getElementById('method').value;
      var url = baseUrl;
      if (person) url += '&person=' + encodeURIComponent(person);
      if (method) url += '&method=' + method;
      document.getElementById('customUrl').value = url;
    }
    document.getElementById('person').addEventListener('input', buildCustom);
    document.getElementById('method').addEventListener('change', buildCustom);

    function render(info) {
      baseUrl = info.url;
      buildCustom();
      document.getElementById('url').value = info.url;
      var e = info.lastEvent;
      document.getElementById('last').textContent = e
        ? Homey.__('settings.last') + ' ' + new Date(e.at).toLocaleString() + ' — ' + (e.person || '-') + ' (' + e.type + '), ' + (e.alarm || '')
        : Homey.__('settings.none');
    }

    function load() {
      Homey.api('GET', '/webhook-info', null, function (err, info) {
        if (err) return Homey.alert(err.message || err);
        render(info);
      });
    }

    function copyFrom(id) {
      copyField(document.getElementById(id), function (ok) {
        Homey.alert(Homey.__(ok ? 'settings.copied' : 'settings.copy_manual'));
      });
    }
    document.getElementById('copy').addEventListener('click', function () { copyFrom('url'); });
    document.getElementById('copyCustom').addEventListener('click', function () { copyFrom('customUrl'); });

    document.getElementById('regen').addEventListener('click', function () {
      Homey.confirm(Homey.__('settings.regenerate_confirm'), 'warning', function (err, ok) {
        if (!ok) return;
        Homey.api('POST', '/webhook-token', null, function (e, info) {
          if (e) return Homey.alert(e.message || e);
          render(info);
        });
      });
    });

    load();
    Homey.ready();
  }
</script>
</body>
</html>
