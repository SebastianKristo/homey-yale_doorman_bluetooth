<form id="form" class="homey-form">
  <p data-i18n="">Enter the offline key and slot of your lock. / Skriv inn offline-nøkkel og slot for låsen.</p>
  <div class="homey-form-group">
    <label class="homey-form-label" for="key">Offline key / Offline-nøkkel</label>
    <input class="homey-form-input" id="key" type="text" placeholder="0123456789abcdef0123456789abcdef" autocomplete="off" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="slot">Slot</label>
    <input class="homey-form-input" id="slot" type="number" value="1" min="0" max="255" />
  </div>
  <button class="homey-button-primary-full" type="submit">Next / Neste</button>
</form>
<script>
  Homey.setTitle('Yale Bluetooth');
  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    Homey.emit('credentials', {
      key: document.getElementById('key').value,
      slot: document.getElementById('slot').value,
    }).then(function () { Homey.nextView(); })
      .catch(function (err) { Homey.alert(err.message || err, 'error'); });
  });
</script>
