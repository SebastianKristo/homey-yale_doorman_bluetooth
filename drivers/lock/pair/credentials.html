<style>
  .help { margin: 4px 0 16px; border-radius: 10px; background: var(--homey-color-mono-050, #f4f5f7); padding: 4px 12px; }
  .help summary { cursor: pointer; font-weight: 600; padding: 8px 0; }
  .help ol { padding-left: 18px; margin: 4px 0 10px; }
  .help li { margin: 6px 0; line-height: 1.4; }
  .help h4 { margin: 12px 0 4px; font-size: 14px; }
  .help p { margin: 6px 0; line-height: 1.4; }
  .cmd { position: relative; margin: 6px 0; }
  .cmd textarea { resize: none; width: 100%; box-sizing: border-box; border: 0; outline: none; -webkit-user-select: text; user-select: text; display: block; margin: 0; padding: 10px 64px 10px 10px; border-radius: 8px; background: #1e2430; color: #e8eaed;
    font: 12px/1.45 ui-monospace, Menlo, Consolas, monospace; white-space: pre-wrap; word-break: break-all; }
  .cmd button { position: absolute; top: 6px; right: 6px; border: 0; border-radius: 6px; padding: 4px 8px;
    background: #3b4556; color: #fff; font-size: 12px; }
  .note { font-size: 13px; opacity: .8; }
  .proxy { margin-bottom: 16px; }
</style>

<form id="form" class="homey-form">
  <p data-t="pair.intro"></p>

  <details class="help">
    <summary data-t="pair.help.title"></summary>

    <h4 data-t="pair.help.ha_title"></h4>
    <ol>
      <li data-t="pair.help.ha_step1"></li>
      <li data-t="pair.help.ha_step2"></li>
    </ol>
    <div class="cmd"><textarea readonly rows="4">jq '.data.entries[] | select(.domain=="yalexs_ble") | {title, key: .data.key, slot: .data.slot, address: .data.address}' /config/.storage/core.config_entries</textarea></div>
    <p data-t="pair.help.ha_result"></p>

    <h4 data-t="pair.help.cloud_title"></h4>
    <p data-t="pair.help.cloud_text"></p>

    <h4 data-t="pair.help.noha_title"></h4>
    <p data-t="pair.help.noha_text"></p>
    <p class="note">github.com/SebastianKristo/homey-yale_doorman_bluetooth</p>

    <h4 data-t="pair.help.after_title"></h4>
    <p data-t="pair.help.after_text"></p>
  </details>

  <div class="homey-form-group">
    <label class="homey-form-label" for="key" data-t="pair.key_label"></label>
    <input class="homey-form-input" id="key" type="text" placeholder="0123456789abcdef0123456789abcdef" autocomplete="off" autocapitalize="off" spellcheck="false" />
  </div>
  <div class="homey-form-group">
    <label class="homey-form-label" for="slot" data-t="pair.slot_label"></label>
    <input class="homey-form-input" id="slot" type="number" value="1" min="0" max="255" />
  </div>

  <details class="help proxy">
    <summary data-t="pair.proxy.title"></summary>
    <p data-t="pair.proxy.text"></p>
    <div class="homey-form-group">
      <label class="homey-form-label" for="proxyHost" data-t="pair.proxy.host_label"></label>
      <textarea class="homey-form-input" id="proxyHost" rows="3" placeholder="192.168.0.50&#10;192.168.0.51" autocomplete="off" autocapitalize="off"></textarea>
    </div>
    <div class="homey-form-group">
      <label class="homey-form-label" for="proxyKey" data-t="pair.proxy.key_label"></label>
      <input class="homey-form-input" id="proxyKey" type="password" autocomplete="off" />
    </div>
    <p data-t="pair.proxy.find"></p>
    <div class="cmd"><textarea readonly rows="4">jq '.data.entries[] | select(.domain=="esphome") | {title, host: .data.host, key: .data.noise_psk}' /config/.storage/core.config_entries</textarea></div>
  </details>

  <button class="homey-button-primary-full" type="submit" data-t="pair.next"></button>
</form>

<script>
  Homey.setTitle('Yale Doorman L3');

  document.querySelectorAll('[data-t]').forEach(function (el) {
    el.textContent = Homey.__(el.getAttribute('data-t'));
  });

  // Homey's in-app browser blocks the async clipboard API and text selection in
  // ordinary elements. A selected read-only textarea + execCommand('copy') works
  // there; if even that fails the text stays selected for a manual copy.
  function copyField(el, onDone) {
    el.focus();
    el.select();
    try { el.setSelectionRange(0, el.value.length); } catch (e) { /* not supported */ }
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (ok) return onDone(true);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(el.value).then(function () { onDone(true); }, function () { onDone(false); });
    } else {
      onDone(false);
    }
  }

  document.querySelectorAll('.cmd').forEach(function (box) {
    var field = box.querySelector('textarea');
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = Homey.__('pair.copy');
    btn.addEventListener('click', function () {
      copyField(field, function (ok) {
        btn.textContent = Homey.__(ok ? 'pair.copied' : 'pair.copy_manual');
        setTimeout(function () { btn.textContent = Homey.__('pair.copy'); }, 2000);
      });
    });
    box.appendChild(btn);
  });

  document.getElementById('form').addEventListener('submit', function (e) {
    e.preventDefault();
    Homey.emit('credentials', {
      key: document.getElementById('key').value,
      slot: document.getElementById('slot').value,
      proxyHost: document.getElementById('proxyHost').value,
      proxyKey: document.getElementById('proxyKey').value,
    }).then(function () { Homey.nextView(); })
      .catch(function (err) { Homey.alert(err.message || err, 'error'); });
  });
</script>
